[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-platform"
version = "1.0.0"
description = "Institutional Multi-Asset Algorithmic Trading Platform"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # --- Web Framework ---
    "fastapi==0.109.2",
    "uvicorn[standard]==0.27.1",
    "httpx==0.26.0",
    "aiohttp==3.9.3",
    "websockets==12.0",

    # --- Data ---
    "pandas==2.2.0",
    "numpy==1.26.4",
    "scipy==1.12.0",

    # --- Database ---
    "asyncpg==0.29.0",
    "sqlalchemy[asyncio]==2.0.27",
    "alembic==1.13.1",
    "redis==5.0.1",

    # --- Configuration ---
    "pydantic==2.6.1",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.1",

    # --- Monitoring ---
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.22.0",
    "opentelemetry-sdk==1.22.0",
    "opentelemetry-instrumentation-fastapi==0.43b0",
    "opentelemetry-exporter-jaeger==1.21.0",

    # --- Dashboard ---
    "streamlit==1.31.1",
    "plotly==5.19.0",
    "altair==5.2.0",

    # --- ML ---
    "scikit-learn==1.4.1.post1",
    "lightgbm==4.3.0",
    "mlflow==2.10.0",

    # --- JIT Compilation ---
    "numba==0.59.0",

    # --- Task Queue ---
    "celery[redis]==5.3.6",

    # --- Utilities ---
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "tenacity==8.2.3",
    "structlog==24.1.0",
]

[project.optional-dependencies]
broker-mt5 = [
    "MetaTrader5==5.0.45",
]
broker-binance = [
    "python-binance==1.0.19",
]
dev = [
    "pytest==8.0.2",
    "pytest-asyncio==0.23.5",
    "pytest-cov==4.1.0",
    "pytest-benchmark==4.0.0",
    "hypothesis==6.98.4",
    "factory-boy==3.3.0",
    "mypy==1.8.0",
    "ruff==0.2.2",
    "pre-commit==3.6.1",
    "ipython==8.21.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "market_data",
    "indicator_engine",
    "strategy_engine",
    "portfolio_engine",
    "risk_engine",
    "execution_engine",
    "backtest_engine",
    "ml_engine",
    "monitoring",
    "notification",
    "api",
    "dashboard",
    "infrastructure",
    "shared",
    "config",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests (no external dependencies)",
    "integration: integration tests (require Redis, Postgres)",
    "slow: slow tests (backtests, ML training)",
]

[tool.coverage.run]
omit = ["tests/*", "*/migrations/*"]
