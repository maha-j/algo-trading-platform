name: CI — Algo Trading Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy pydantic pydantic-settings

      - name: Ruff — lint
        run: ruff check . --select E,F,W,I,N --ignore E501,N806 --exclude migrations/

      - name: Ruff — format check
        run: ruff format --check . --exclude migrations/

      - name: mypy — type check (core + config)
        run: mypy core/ config/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  test:
    name: "🧪 Unit Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pytest==8.1.1 \
            pytest-asyncio==1.4.0 \
            pydantic==2.6.4 \
            pydantic-settings==2.2.1 \
            numpy==1.26.4 \
            pandas==2.2.1 \
            redis==5.0.3 \
            lightgbm==4.3.0 \
            scikit-learn==1.4.1 \
            mlflow==2.11.3 \
            structlog==24.1.0 \
            prometheus-client==0.20.0

      - name: Run unit tests
        env:
          ENVIRONMENT: development
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: trading
          DB_USER: trading
          DB_PASSWORD: ci_test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          API_SECRET_KEY: ci_test_secret_key_minimum_32_characters_ok
          RISK_MAX_POSITION_SIZE_PCT: "0.05"
          RISK_MAX_DAILY_LOSS_PCT: "0.03"
          RISK_MAX_DRAWDOWN_PCT: "0.15"
        run: |
          python -m pytest tests/unit/test_core.py \
            -v \
            --tb=short \
            --no-header \
            -p no:cacheprovider

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: .pytest_cache/
          retention-days: 7

  # ── Security Scan ────────────────────────────────────────────────────────────
  security:
    name: "🔐 Security Scan (bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        run: |
          bandit -r . \
            --exclude "./.venv,./tests,./migrations" \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json \
            || true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 14

  # ── Docker Build ─────────────────────────────────────────────────────────────
  docker:
    name: "🐳 Docker Build (${{ matrix.target }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [core, api, dashboard]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          tags: algo-trading:${{ matrix.target }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Summary ───────────────────────────────────────────────────────────────────
  summary:
    name: "📋 CI Summary"
    runs-on: ubuntu-latest
    needs: [lint, test, security, docker]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
