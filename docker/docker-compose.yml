version: "3.9"

# =============================================================================
# Institutional Algorithmic Trading Platform
# Docker Compose — Production Service Topology
#
# Services:
#   Infrastructure : postgres (TimescaleDB), redis, prometheus, grafana
#   Core engines   : trading-core (all engines in one process, scalable)
#   API            : fastapi-gateway (nginx reverse proxy front)
#   Dashboard      : streamlit
#   Observability  : alertmanager, loki, promtail, jaeger, node-exporter
#
# Design notes:
#   - All services use named volumes for data persistence.
#   - Internal communication uses the `trading` bridge network.
#   - Only nginx and streamlit expose ports to the host.
#   - Secrets are injected via environment variables (use Docker Secrets
#     or Vault in production).
#   - Resource limits are set to prevent a single service starving others.
# =============================================================================

networks:
  trading:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

x-common-env: &common-env
  TZ: UTC
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

x-trading-env: &trading-env
  <<: *common-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: trading
  DB_USER: trading
  DB_PASSWORD: ${DB_PASSWORD:-strongpassword123}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
  MT5_LOGIN: ${MT5_LOGIN:-0}
  MT5_PASSWORD: ${MT5_PASSWORD:-}
  MT5_SERVER: ${MT5_SERVER:-MetaQuotes-Demo}
  NOTIFY_TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
  NOTIFY_TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  NOTIFY_SMTP_HOST: ${SMTP_HOST:-}
  NOTIFY_SMTP_USER: ${SMTP_USER:-}
  NOTIFY_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  NOTIFY_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  API_JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars}


services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpassword123}
      # TimescaleDB tuning
      TS_TUNE_MEMORY: 4GB
      TS_TUNE_NUM_CPUS: "4"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # Localhost only — not exposed to internet
    networks:
      - trading
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispassword}
      --maxmemory 2gb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - trading
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  # ---------------------------------------------------------------------------
  # Core Trading Engines
  # ---------------------------------------------------------------------------

  trading-core:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: core
    container_name: trading-core
    restart: unless-stopped
    environment:
      <<: *trading-env
    volumes:
      - /tmp/ml-models:/tmp          # ML model persistence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading
    ports:
      - "127.0.0.1:8001:8001"        # Internal metrics port
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
      restart_policy:
        condition: on-failure
        max_attempts: 5

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------

  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    container_name: trading-api
    restart: unless-stopped
    environment:
      <<: *trading-env
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_WORKERS: "4"
    depends_on:
      - trading-core
    networks:
      - trading
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  nginx:
    image: nginx:1.25-alpine
    container_name: trading-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro         # TLS certificates
    depends_on:
      - fastapi
    networks:
      - trading
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dashboard
    container_name: trading-dashboard
    restart: unless-stopped
    environment:
      <<: *trading-env
      API_BASE_URL: http://fastapi:8000
    depends_on:
      - fastapi
    networks:
      - trading
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Observability Stack
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: trading-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=50GB"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - trading
    depends_on:
      - trading-core
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  grafana:
    image: grafana/grafana:10.3.0
    container_name: trading-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-worldmap-panel
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - trading
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: trading-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - trading
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  loki:
    image: grafana/loki:2.9.3
    container_name: trading-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./docker/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - trading
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  promtail:
    image: grafana/promtail:2.9.3
    container_name: trading-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./docker/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - trading
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: trading-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: "9411"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - /tmp/jaeger-data:/badger
    ports:
      - "127.0.0.1:16686:16686"     # UI
      - "127.0.0.1:6831:6831/udp"   # Thrift compact
      - "127.0.0.1:4317:4317"       # OTLP gRPC
    networks:
      - trading
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: trading-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - trading
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  # ---------------------------------------------------------------------------
  # ML Experiment Tracking
  # ---------------------------------------------------------------------------

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: trading-mlflow
    restart: unless-stopped
    environment:
      <<: *common-env
      MLFLOW_BACKEND_STORE_URI: postgresql://trading:${DB_PASSWORD:-strongpassword123}@postgres:5432/trading
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://trading:${DB_PASSWORD:-strongpassword123}@postgres:5432/trading
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - /tmp/mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading
    ports:
      - "127.0.0.1:5000:5000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
